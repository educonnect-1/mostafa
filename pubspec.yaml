
name: educonnect
description: EduConnect production-ready Flutter application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  go_router: ^15.1.2
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  uuid: ^4.5.1
  file_picker: ^10.3.3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
