workflows:
  android-build:
    name: Build Android APK & AAB
    working_directory: offline_math_solver_final # مهم جداً لأن مشروعك داخل هذا المجلد
    instance_type: mac_mini_m2 # أو linux، لكن m2 أسرع وأفضل لـ Flutter
    environment:
      flutter: stable
      vars:
        # هذه المتغيرات سيتم جلبها من لوحة تحكم Codemagic
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/offline_math_solver_final/android/local.properties"
      
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      
      - name: Build Android APK (Release)
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      
      - name: Build Android App Bundle (AAB) for Play Store
        script: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
            
    artifacts:
      - offline_math_solver_final/build/app/outputs/flutter-apk/app-release.apk
      - offline_math_solver_final/build/app/outputs/bundle/release/app-release.aab
      - offline_math_solver_final/build/reports/*.xml
      
    publishing:
      # يمكنك تفعيل هذا الجزء لاحقاً لرفع التطبيق تلقائياً
