name: offline_math_solver
description: MathSolve, a professional offline mathematics solver for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  speech_to_text: ^7.4.0
  shared_preferences: ^2.5.5
  math_expressions: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
