name: marwan_elgendi_academy
description: "Marwan Elgendi Academy — Student Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Push notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # Live rooms
  jitsi_meet_flutter_sdk: ^10.2.0

  # Media
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  cached_network_image: ^3.4.0
  flutter_image_compress: ^2.3.0
  file_picker: ^8.0.6
  open_filex: ^4.5.0

  # Calendar
  table_calendar: ^3.1.2

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  connectivity_plus: ^6.0.4
  flutter_dotenv: ^5.1.0
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  logger: ^2.4.0
  path: ^1.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
